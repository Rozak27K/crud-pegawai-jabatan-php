<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pegawai</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        Aplikasi Manajemen Pegawai
    </header>

    <div class="container">
        <aside>

            <ul class="menu">
                <li> <a href="dashboard.html">Dashboard</a> </li>
                <li> <a href="tabel.html" class="aktif">Data Pegawai</a> </li>
                <li> <a href="tabel.html">Data Jabatan</a> </li>
                <li> <a href="login.html" class="logout">Keluar</a> </li>
            </ul>

        </aside>
        <section class="main">

            <div class="form-card">
                <h2 class="judul">Tambah Pegawai</h2>
                <form method="post" action="proses.php">

                    <div class="form-group">
                        <label for="foto">Foto</label>
                        <div class="input"><input type="file" name="foto" id="foto"></div>
                    </div>

                    <div class="form-group">
                        <label for="nama">Nama</label>
                        <div class="input"><input type="text" name="nama" id="nama"></div>
                    </div>

                    <div class="form-group">
                        <label>Jenis Kelamin</label>
                        <div class="input radio-group">
                            <label for=""><input type="radio" id="jk-l" name="jk" value="L">Laki-laki</label>
                            <label><input type="radio" id="jk-p" name="jk" value="P">Perempuan</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="tanggal">Tanggal</label>
                        <div class="input"><input type="date" name="tanggal" id="tanggal"></div>
                    </div>

                    <div class="form-group">
                        <label for="jabatan">Jabatan</label>
                        <div class="input">
                            <select name="jabatan" id="jabatan">
                                <option value="direktur">Direktur</option>
                                <option value="manajer">Manajer</option>
                                <option value="marketing">Marketing</option>
                                <option value="sekertaris">Sekertaris</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group tombol-group">
                        <div class="input">
                            <input type="submit" value="Simpan" class="tombol simpan">
                            <input type="reset" value="Batal" class="tombol reset">
                            <a href="tabel.html" class="tombol kembali">kembali</a>
                        </div>
                    </div>
                </form>
            </div>

        </section>
    </div>

    <footer>
        Copyright &copy; Jak
    </footer>
</body>
</html>
